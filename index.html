<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahratohidipix</title>
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 2rem;
      text-align: center;
      background-color: #222;
    }
    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      background-color: #1a1a1a;
      padding: 1rem 0;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #999;
    }
    section {
      padding: 2rem;
    }
    section h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
    }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .gallery a {
      position: relative;
      display: block;
      width: 300px;
      height: 200px;
      border-radius: 8px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .gallery a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    .gallery a img {
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .gallery a {
        width: 100%;
        height: auto;
      }
    }
    @media (max-width: 480px) {
      nav {
        flex-direction: column;
        gap: 1rem;
      }
      header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Zahratohidipix</h1>
  </header>

  <nav>
    <a href="#street">Street</a>
    <a href="#portrait">Portrait</a>
    <a href="#documentary">Documentary</a>
    <a href="#color">The color collection</a>
  </nav>

  <section id="street">
    <h2>Street Photography</h2>
    <div class="gallery">
      <a href="street1.png" style="background-image: url('street1.png')" data-lightbox="street"></a>
      <a href="street2.png" style="background-image: url('street2.png')" data-lightbox="street"></a>
      <a href="street3.png" style="background-image: url('street3.png')" data-lightbox="street"></a>

      <a href="street6.png" style="background-image: url('street6.png')" data-lightbox="street"></a>
      <a href="street7.png" style="background-image: url('street7.png')" data-lightbox="street"></a>
      <a href="street8.png" style="background-image: url('street8.png')" data-lightbox="street"></a>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/js/lightbox.min.js"></script>
  <script>
    lightbox.option({
      'wrapAround': true,
      'alwaysShowNavOnTouchDevices': true,
    });

    document.addEventListener('contextmenu', function(e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
